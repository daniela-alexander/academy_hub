{% extends "base.html" %}

{% block title %}
Eliminar valoración | Academy Hub
{% endblock %}

{% block content %}

<h1>Eliminar valoración</h1>

<p>
    ¿Seguro que quieres eliminar esta valoración de la academia
    <strong>{{ object.academy.name }}</strong>?
</p>

<form method="post">
    {% csrf_token %}
    <button type="submit">Sí, eliminar</button>
</form>

<p>
    <a href="{% url 'academies:detail' object.academy.slug %}">
        Cancelar
    </a>
</p>

{% endblock %}
