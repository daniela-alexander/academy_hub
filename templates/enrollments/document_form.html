{% extends "base.html" %}

{% block title %}Añadir documento{% endblock %}

{% block content %}
<h1>Añadir documento</h1>

<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Subir</button>
    <a href="{% url 'enrollments:detail' view.kwargs.enrollment_pk %}">Cancelar</a>
</form>
{% endblock %}
