<form method="get">
    <p>
        <input type="search" name="q" value="{{ request.GET.q }}" placeholder="Buscar usuario
    </p>
    <p>
        <select name=" role">
        <option value="">Todos los roles</option>
        <option value="academy" {% if request.GET.role=="academy" %}selected{% endif %} <option value="student" {% if
            request.GET.role=="student" %}selected{% endif %} <option value="staff" {% if request.GET.role=="staff"
            %}selected{% endif %}>Sta
            </select>
    </p>
    <button type="submit">Filtrar</button>
</form>
{% if is_paginated %}
<nav>
    {% if page_obj.has_previous %}
    <a href="?{{ querystring }}&page={{ page_obj.previous_page_number }}">Anterior</a {% endif %} <span>Página {{
    page_obj.number }} de {{ page_obj.paginator.num_pages }}</span>
    {% if page_obj.has_next %}
    <a href="?{{ querystring }}&page={{ page_obj.next_page_number }}">Siguiente</a>
    {% endif %}
</nav>
{% endif %}
