{%extends "base.html" %}

{% block title %}
    Iniciar sesión | Academy Hub
{% endblock %}

{% block content %}
    <h1>Iniciar sesión</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Entrar</button>
    </form>

    <p>¿No tienes cuenta? <a href="{% url 'accounts:register' %}">Regístrate aquí</a></p>
{% endblock %}
