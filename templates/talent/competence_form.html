{% extends "base.html" %}

{% block title %}
{% if object %}
Editar competencia
{% else %}
Nueva competencia
{% endif %}
| Academy Hub
{% endblock %}

{% block content %}

<h1>
    {% if object %}
    Editar competencia
    {% else %}
    Nueva competencia
    {% endif %}
</h1>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">
        {% if object %}
        Guardar cambios
        {% else %}
        Crear competencia
        {% endif %}
    </button>
</form>

{% endblock %}
