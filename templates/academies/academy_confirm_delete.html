{% extends "base.html" %}

{% block title %}Eliminar academia{% endblock %}

{% block content %}
<h1>Eliminar academia</h1>
<p>¿Seguro que quieres eliminar «{{ object.name }}»? Esta acción no se puede deshacer.</p>

<form method="post">
    {% csrf_token %}
    <button type="submit">Sí, eliminar</button>
    <a href="{% url 'academies:detail' object.slug %}">Cancelar</a>
</form>
{% endblock %}
