{% extends "base.html" %}

{% block title %}Eliminar imagen{% endblock %}

{% block content %}
<h1>Eliminar imagen</h1>
<p>¿Seguro que quieres eliminar esta imagen del curso «{{ object.course.title }}»?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit">Sí, eliminar</button>
    <a href="{{ object.course.get_absolute_url }}">Cancelar</a>
</form>
{% endblock %}
