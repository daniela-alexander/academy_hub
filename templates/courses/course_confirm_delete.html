{% extends "base.html" %}

{% block title %}Eliminar curso{% endblock %}

{% block content %}
<h1>Eliminar curso</h1>
<p>¿Seguro que quieres eliminar «{{ object.title }}»?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit">Sí, eliminar</button>
    <a href="{{ object.get_absolute_url }}">Cancelar</a>
</form>
{% endblock %}
